<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#dfece2" />
    <meta name="description" content="Join the larp community." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://larpable.vercel.app/" />
    <meta property="og:title" content="larpable" />
    <meta property="og:description" content="Join the larp community." />
    <meta property="og:image" content="https://larpable.vercel.app/social-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The pink larpable L logo on mint green." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://larpable.vercel.app/social-logo.png" />
    <title>larpable</title>
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main aria-label="larpable community">
      <div class="community">
        <div class="count" aria-live="polite" aria-atomic="true">
          <span class="count-value">—</span>
          <span class="count-label">in the larp community</span>
        </div>
        <div class="button-wrap">
          <button class="join-button" type="button" disabled>
            <span class="button-label">Join the larp community</span>
            <span class="button-mark" aria-hidden="true">+</span>
          </button>
          <div class="celebration" aria-hidden="true"></div>
        </div>
        <p class="status" role="status">Checking the count…</p>
      </div>
    </main>
    <dialog class="sign-in-dialog" aria-labelledby="sign-in-title">
      <button class="dialog-close" type="button" aria-label="Close sign-in">×</button>
      <h1 id="sign-in-title">Join the community</h1>
      <div class="google-button"></div>
      <p class="sign-in-status" role="status"></p>
    </dialog>
  </body>
</html>
